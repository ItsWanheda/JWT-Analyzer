# pyproject.toml

[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "jwt-analyzer"
version = "2.0.0.dev0"
description = "JWT security analysis CLI and Python API"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "ItsWanheda" }]
keywords = ["jwt", "json-web-token", "security", "pentest", "cryptography", "token", "audit", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "PyJWT[crypto]>=2.8.0",
    "cryptography>=41.0.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "requests>=2.31.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.11.0",
    "responses>=0.23.0",
    "freezegun>=1.2.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0,<2.0.0",
    "bandit>=1.7.0",
    "pre-commit>=3.4.0",
    "tox>=4.0.0",
    "build>=1.0.0",
    "twine>=4.0.0",
]
service = [
    "fastapi>=0.110.0",
    "starlette>=0.46.0,<1.0.0",
    "uvicorn>=0.27.0",
    "httpx>=0.25.0",
]

[project.urls]
Homepage = "https://github.com/ItsWanheda/jwt-analyzer"
Repository = "https://github.com/ItsWanheda/jwt-analyzer"
Issues = "https://github.com/ItsWanheda/jwt-analyzer/issues"
Changelog = "https://github.com/ItsWanheda/jwt-analyzer/blob/main/CHANGELOG.md"

[project.scripts]
jwt-analyzer = "main:cli"
jwt-analyzer-api = "jwt_analyzer.service:main"

# Keep the legacy CLI and internal compatibility modules in the wheel while
# making jwt_analyzer the supported v2 import surface.
[tool.hatch.build.targets.wheel]
packages = ["jwt_analyzer", "core", "utils", "plugins"]

[tool.hatch.build.targets.wheel.force-include]
"main.py" = "main.py"
"config.py" = "config.py"
"utils/wordlists/common_secrets.txt" = "utils/wordlists/common_secrets.txt"

[tool.ruff]
line-length = 100
target-version = "py39"
extend-exclude = ["wordlists", "build", "dist", ".venv", ".tox"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "C4", "UP", "S", "RUF", "N", "SIM",
    "PIE", "PL", "RET", "TRY", "YTT", "ISC", "PGH", "EXE",
]
ignore = [
    "S101",
    "S104",
    "PLR0913",
    "TRY003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "PLR2004", "ARG", "FBT", "SLF001"]
"main.py" = ["BLE001"]
# Service intentionally embeds HTML/CSS/JS and uses FastAPI dependency-injection defaults.
# Keep the exceptions scoped to this optional framework adapter, not the core API.
"jwt_analyzer/service.py" = ["E501", "PLR0915", "B008", "PLR2004", "PLC0415"]

[tool.ruff.lint.isort]
known-first-party = ["jwt_analyzer", "core", "utils", "config"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.9"
strict = false
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
exclude = ["build/", "dist/", "wordlists/", ".venv/"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
check_untyped_defs = false

[tool.pytest.ini_options]
minversion = "7.0"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--tb=short",
]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests that require network access",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["jwt_analyzer", "core", "utils", "config"]
branch = true
omit = ["tests/*", "wordlists/*", ".venv/*"]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
# Coverage will be ratcheted up as v2 test coverage expands.
fail_under = 0
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "@abc.abstractmethod",
    "\\.\\.\\.",
    "pass",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"

[tool.bandit]
exclude_dirs = ["tests", "wordlists", ".venv"]
skips = ["B101"]

[tool.tox]
env_list = ["py39", "py310", "py311", "py312", "py313", "py314", "lint", "security"]

[tool.tox.env_run_base]
deps = ["pytest>=7.4.0", "pytest-cov>=4.1.0"]
commands = [["pytest", { replace = "posargs", extend = true }]]

[tool.tox.env.lint]
deps = ["ruff>=0.1.0", "mypy>=1.5.0,<2.0.0"]
commands = [
    ["ruff", "check", "jwt_analyzer"],
    ["ruff", "format", "--check", "jwt_analyzer"],
    ["mypy", "jwt_analyzer"],
]

[tool.tox.env.security]
deps = ["bandit[toml]>=1.7.0"]
commands = [["bandit", "-r", "jwt_analyzer", "-c", "pyproject.toml"]]
